# Runs a trivial query once a day so the free Supabase project isn't paused for inactivity.
# Needs a DATABASE_URL repository secret (Settings > Secrets and variables > Actions).
name: Database ping

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:

# The job only reads a secret; its GitHub token needs no access to the repository.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only --command "select 1"
